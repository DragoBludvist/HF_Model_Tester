<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOC Alert Classification Dashboard — SecureBERT 2.0</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f172a; color: #e2e8f0; font-family: 'DM Sans', sans-serif; padding: 24px; min-height: 100vh; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #1e293b; }
  ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .container { max-width: 1280px; margin: 0 auto; }

  .header { margin-bottom: 28px; }
  .header h1 { font-size: 26px; font-weight: 700; color: #f1f5f9; }
  .header .subtitle { font-size: 13px; color: #64748b; margin-top: 4px; }
  .header .model-tag { font-size: 13px; color: #64748b; font-family: 'JetBrains Mono', monospace; margin-left: 12px; }

  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat-card { background: #1e293b; border-radius: 10px; padding: 16px 18px; }
  .stat-card .label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .stat-card .value { font-size: 28px; font-weight: 700; color: #f1f5f9; font-family: 'JetBrains Mono', monospace; }
  .stat-card .sub { font-size: 12px; color: #64748b; margin-top: 2px; }
  .stat-card.threat { border-left: 3px solid #ef4444; }
  .stat-card.benign { border-left: 3px solid #10b981; }
  .stat-card.accuracy { border-left: 3px solid #6366f1; }
  .stat-card.speed { border-left: 3px solid #f59e0b; }

  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .filter-btn { padding: 6px 14px; border-radius: 6px; border: 1px solid #334155; background: transparent; color: #94a3b8; font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
  .filter-btn:hover { border-color: #475569; color: #e2e8f0; }
  .filter-btn.active { background: #334155; border-color: #475569; color: #f1f5f9; }
  .filter-btn.active-cat { border-color: var(--cat-color); color: var(--cat-color); background: color-mix(in srgb, var(--cat-color) 10%, transparent); }
  .divider { width: 1px; height: 24px; background: #334155; margin: 0 4px; }
  .search-input { margin-left: auto; padding: 6px 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 13px; width: 220px; outline: none; font-family: 'DM Sans', sans-serif; }
  .search-input:focus { border-color: #6366f1; }
  .result-count { font-size: 13px; color: #64748b; margin-bottom: 12px; }

  .main-layout { display: flex; gap: 16px; }
  .table-section { flex: 1; transition: flex 0.2s; }
  .table-section.with-detail { flex: 0 0 56%; }
  .detail-section { flex: 0 0 42%; }

  .alert-table { background: #1e293b; border-radius: 10px; overflow: hidden; }
  .table-header { display: grid; grid-template-columns: 54px 88px 1fr 96px 84px; padding: 10px 16px; border-bottom: 1px solid #334155; gap: 8px; }
  .table-header span { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; user-select: none; display: flex; align-items: center; gap: 3px; }
  .table-header span:hover { color: #e2e8f0; }
  .table-body { max-height: 520px; overflow-y: auto; }
  .alert-row { display: grid; grid-template-columns: 54px 88px 1fr 96px 84px; padding: 10px 16px; gap: 8px; border-bottom: 1px solid rgba(30,41,59,0.6); cursor: pointer; align-items: center; transition: background 0.1s; border-left: 3px solid transparent; }
  .alert-row:hover { background: rgba(51,65,85,0.3); }
  .alert-row.selected { background: #334155; }
  .alert-row.is-threat { border-left-color: #ef4444; }
  .alert-row .id { font-size: 12px; color: #64748b; font-family: 'JetBrains Mono', monospace; }
  .cat-badge { font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: 600; text-align: center; display: inline-block; }
  .alert-text { font-size: 13px; color: #cbd5e1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conf-cell { text-align: center; }
  .conf-value { font-size: 13px; font-family: 'JetBrains Mono', monospace; font-weight: 600; }
  .conf-bar { width: 100%; height: 3px; background: #0f172a; border-radius: 2px; margin-top: 3px; }
  .conf-bar-fill { height: 100%; border-radius: 2px; }
  .verdict-badge { font-size: 12px; font-weight: 600; text-align: center; padding: 4px 10px; border-radius: 5px; display: inline-block; }

  .detail-panel { background: #1e293b; border-radius: 10px; padding: 20px; max-height: 580px; overflow-y: auto; }
  .detail-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .close-btn { background: none; border: none; color: #64748b; cursor: pointer; font-size: 20px; line-height: 1; padding: 0; }
  .close-btn:hover { color: #e2e8f0; }
  .detail-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .detail-alert-text { font-size: 13px; color: #cbd5e1; background: #0f172a; border-radius: 8px; padding: 12px; margin-bottom: 16px; font-family: 'JetBrains Mono', monospace; line-height: 1.6; word-break: break-all; max-height: 100px; overflow-y: auto; }
  .detail-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .detail-metric { background: #0f172a; border-radius: 8px; padding: 10px; }
  .detail-metric .dm-label { font-size: 11px; color: #64748b; margin-bottom: 2px; }
  .detail-metric .dm-value { font-size: 20px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
  .key-field { display: flex; gap: 8px; margin-bottom: 4px; font-size: 13px; }
  .key-field .kf-label { color: #64748b; min-width: 110px; flex-shrink: 0; }
  .key-field .kf-value { color: #cbd5e1; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .assessment-box { font-size: 13px; color: #e2e8f0; background: #0f172a; border-radius: 8px; padding: 12px; margin-bottom: 16px; line-height: 1.6; }
  .assessment-box.threat { border-left: 3px solid #ef4444; }
  .assessment-box.benign { border-left: 3px solid #10b981; }
  .assessment-box.ai { border-left: 3px solid #6366f1; }
  .ai-btn { width: 100%; padding: 10px 16px; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: #e2e8f0; font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
  .ai-btn:hover { background: #334155; }
  .ai-btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

  .upload-section { text-align: center; padding: 40px; background: #1e293b; border-radius: 10px; border: 2px dashed #334155; margin-bottom: 24px; }
  .upload-section p { color: #94a3b8; font-size: 14px; margin-bottom: 12px; }
  .upload-btn { padding: 10px 24px; border-radius: 8px; border: 1px solid #6366f1; background: #6366f11a; color: #a5b4fc; font-size: 14px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .upload-btn:hover { background: #6366f133; }

  @media (max-width: 900px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .main-layout { flex-direction: column; }
    .table-section.with-detail { flex: 1; }
    .detail-section { flex: 1; }
  }
</style>
</head>
<body>
<div class="container" id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

<script type="text/babel">
const { useState, useMemo, useCallback, useRef } = React;

const SAMPLE_DATA = {
  metadata: { model: "SecureBERT 2.0 + LoRA", total_alerts: 5000, threats_found: 1368, benign_filtered: 3632, accuracy: 99.74, avg_time_per_alert_ms: 12.4, generated_at: new Date().toISOString() },
  alerts: [
    { id: 1, source_category: "cloud", prediction: "threat", confidence: 0.9991, threat_probability: 0.9991, alert_text: "[cloud] Cloud event (aws:cloudtrail): RunInstances | from 139.198.18.205 | on host splunk.froth.ly", actual_label: "threat", rule_summary: { key_fields: { event: "RunInstances", source_ip: "139.198.18.205" }, analyst_note: "Unauthorized EC2 instance launch. Possible crypto mining. Verify IAM permissions." }},
    { id: 2, source_category: "windows", prediction: "threat", confidence: 0.9987, threat_probability: 0.9987, alert_text: "[windows] A new process has been created. | Security ID: NT AUTHORITY\\SYSTEM | Account Name: BSTOLL-L$ | Process Name: C:\\Windows\\System32\\cmd.exe | Command Line: cmd.exe /c wmic os get LocalDateTime", actual_label: "threat", rule_summary: { key_fields: { event: "Process created", process: "cmd.exe", account: "BSTOLL-L$", command: "wmic os get LocalDateTime" }, analyst_note: "Suspicious process execution detected. Review command line for malicious intent." }},
    { id: 3, source_category: "network", prediction: "threat", confidence: 0.9962, threat_probability: 0.9962, alert_text: "[network] Network event (stream:tcp) | from 167.114.13.150:44832 to 172.31.12.76:22 | bytes_in=2269 bytes_out=3625", actual_label: "threat", rule_summary: { key_fields: { connection: "167.114.13.150:44832 -> 172.31.12.76:22", traffic: "bytes_in=2269 bytes_out=3625" }, analyst_note: "SSH connection from known attacker IP. Investigate lateral movement or C2." }},
    { id: 4, source_category: "linux", prediction: "threat", confidence: 0.9978, threat_probability: 0.9978, alert_text: "[linux] Aug 20 09:08:51 ip-172-31-12-76 sshd[9003]: input_userauth_request: invalid user administrues [preauth]", actual_label: "threat", rule_summary: { key_fields: { service: "sshd", event: "invalid user: administrues" }, analyst_note: "SSH brute force attempt. Invalid username tried. Check source IP for known scanners." }},
    { id: 5, source_category: "cloud", prediction: "threat", confidence: 0.9945, threat_probability: 0.9945, alert_text: "[cloud] Cloud event (aws:cloudtrail): CreateAccessKey | from 35.153.154.221 | on host splunk.froth.ly", actual_label: "threat", rule_summary: { key_fields: { event: "CreateAccessKey", source_ip: "35.153.154.221" }, analyst_note: "IAM modification detected. Possible backdoor creation. Review CloudTrail immediately." }},
    { id: 6, source_category: "windows", prediction: "threat", confidence: 0.9934, threat_probability: 0.9934, alert_text: "[windows] The Windows Filtering Platform has blocked a connection. | Application: svchost.exe | Direction: Outbound | Source: 192.168.247.131 | Destination: 40.67.251.132", actual_label: "threat", rule_summary: { key_fields: { event: "WFP blocked connection", application: "svchost.exe", destination: "40.67.251.132" }, analyst_note: "Connection blocked by Windows Filtering Platform. Possible C2 communication attempt." }},
    { id: 7, source_category: "cloud", prediction: "threat", confidence: 0.9901, threat_probability: 0.9901, alert_text: "[cloud] Cloud event (aws:cloudtrail): CreateUser | from 35.153.154.221 | on host splunk.froth.ly", actual_label: "threat", rule_summary: { key_fields: { event: "CreateUser", source_ip: "35.153.154.221" }, analyst_note: "IAM user creation from external IP. Possible backdoor. Review CloudTrail immediately." }},
    { id: 8, source_category: "cloud", prediction: "threat", confidence: 0.9889, threat_probability: 0.9889, alert_text: "[cloud] Cloud event (aws:cloudtrail): ConsoleLogin | from 157.97.121.132 | on host splunk.froth.ly", actual_label: "threat", rule_summary: { key_fields: { event: "ConsoleLogin", source_ip: "157.97.121.132" }, analyst_note: "Console login from external IP. Verify with account owner." }},
    { id: 9, source_category: "windows", prediction: "threat", confidence: 0.9912, threat_probability: 0.9912, alert_text: "[windows] Special privileges assigned to new logon. | Security ID: NT AUTHORITY\\SYSTEM | Privileges: SeAssignPrimaryTokenPrivilege SeAuditPrivilege", actual_label: "threat", rule_summary: { key_fields: { event: "Special privileges assigned", account: "SYSTEM" }, analyst_note: "Privilege escalation detected. Verify if expected for this account." }},
    { id: 10, source_category: "windows", prediction: "threat", confidence: 0.9867, threat_probability: 0.9867, alert_text: "[windows] An account failed to log on. | Account Name: Guest | Account Domain: MKRAEUS-L | Logon Type: 3 | Failure Reason: Account currently disabled.", actual_label: "threat", rule_summary: { key_fields: { event: "Failed logon", account: "Guest", reason: "Account disabled" }, analyst_note: "Failed authentication attempt. Check for brute force pattern." }},
    { id: 11, source_category: "linux", prediction: "threat", confidence: 0.9823, threat_probability: 0.9823, alert_text: "[linux] Aug 20 11:37:04 ip-172-16-0-178 sshd[27438]: Invalid user test from 138.122.255.144 port 33043", actual_label: "threat", rule_summary: { key_fields: { service: "sshd", event: "Invalid user: test", source_ip: "138.122.255.144" }, analyst_note: "SSH brute force attempt. Check source IP for known scanners." }},
    { id: 12, source_category: "network", prediction: "threat", confidence: 0.9756, threat_probability: 0.9756, alert_text: "[network] Network event (stream:tcp) | from 221.194.47.236:51286 to 172.31.12.76:22 | bytes_in=222 bytes_out=592", actual_label: "threat", rule_summary: { key_fields: { connection: "221.194.47.236:51286 -> 172.31.12.76:22", traffic: "bytes_in=222 bytes_out=592" }, analyst_note: "SSH connection from known attacker IP. Investigate." }},
    { id: 13, source_category: "windows", prediction: "threat", confidence: 0.9876, threat_probability: 0.9876, alert_text: "[windows] A service was installed in the system. | Service Name: MpKsl2d84a0f7 | Service File: C:\\ProgramData\\Microsoft\\Windows Defender\\Definition Updates | Account: BSTOLL-L$", actual_label: "threat", rule_summary: { key_fields: { event: "Service installed", service: "MpKsl2d84a0f7", account: "BSTOLL-L$" }, analyst_note: "New service installed on compromised host. Check for persistence mechanism." }},
    { id: 14, source_category: "windows", prediction: "benign", confidence: 0.9994, threat_probability: 0.0006, alert_text: "[windows] The Windows Filtering Platform has permitted a connection. | Application: chrome.exe | Direction: Outbound", actual_label: "benign", rule_summary: { key_fields: { event: "WFP permitted connection", application: "chrome.exe" }, analyst_note: "Normal Windows activity. No action required." }},
    { id: 15, source_category: "cloud", prediction: "benign", confidence: 0.9988, threat_probability: 0.0012, alert_text: "[cloud] Cloud event (aws:cloudtrail): DescribeInstances | from 34.215.24.225 | on host splunk.froth.ly", actual_label: "benign", rule_summary: { key_fields: { event: "DescribeInstances", source_ip: "34.215.24.225" }, analyst_note: "Normal cloud API activity." }},
    { id: 16, source_category: "linux", prediction: "benign", confidence: 0.9997, threat_probability: 0.0003, alert_text: "[linux] Aug 20 13:38:02 hoth osqueryd[4282]: I0726 00:50:02.782754 4305 virtual_table.cpp:300] Error casting status () to BIGINT", actual_label: "benign", rule_summary: { key_fields: { service: "osqueryd", event: "Error casting status" }, analyst_note: "Normal Linux system activity." }},
    { id: 17, source_category: "network", prediction: "benign", confidence: 0.9991, threat_probability: 0.0009, alert_text: "[network] Network event (stream:udp) | from 172.16.0.178:56874 to 172.16.0.2:53 | bytes_in=75 bytes_out=91", actual_label: "benign", rule_summary: { key_fields: { connection: "172.16.0.178:56874 -> 172.16.0.2:53 (DNS)", traffic: "bytes_in=75 bytes_out=91" }, analyst_note: "Normal DNS query traffic." }},
    { id: 18, source_category: "windows", prediction: "benign", confidence: 0.9982, threat_probability: 0.0018, alert_text: "[windows] A privileged service was called. | Security ID: AzureAD\\PeatCerf | Service: Security | Privilege: SeTcbPrivilege", actual_label: "benign", rule_summary: { key_fields: { event: "Privileged service called", account: "PeatCerf" }, analyst_note: "Normal Windows activity. No action required." }},
    { id: 19, source_category: "cloud", prediction: "benign", confidence: 0.9976, threat_probability: 0.0024, alert_text: "[cloud] Cloud event (aws:cloudtrail): GetBucketLogging | from 34.215.24.225 | on host splunk.froth.ly", actual_label: "benign", rule_summary: { key_fields: { event: "GetBucketLogging", source_ip: "34.215.24.225" }, analyst_note: "Normal cloud API activity." }},
    { id: 20, source_category: "network", prediction: "benign", confidence: 0.9985, threat_probability: 0.0015, alert_text: "[network] Network event (stream:ip) | from 192.168.247.131 to 192.168.247.2 | bytes_in=100 bytes_out=175", actual_label: "benign", rule_summary: { key_fields: { connection: "192.168.247.131 -> 192.168.247.2", traffic: "bytes_in=100 bytes_out=175" }, analyst_note: "Normal internal network traffic." }},
  ]
};

const catColors = { windows: "#818cf8", linux: "#34d399", network: "#fbbf24", cloud: "#60a5fa" };

function App() {
  const [data, setData] = useState(SAMPLE_DATA);
  const [filter, setFilter] = useState("all");
  const [catFilter, setCatFilter] = useState("all");
  const [search, setSearch] = useState("");
  const [selected, setSelected] = useState(null);
  const [llmAnalysis, setLlmAnalysis] = useState({});
  const [llmLoading, setLlmLoading] = useState({});
  const [sortBy, setSortBy] = useState("threat_probability");
  const [sortDir, setSortDir] = useState("desc");
  const [usingCustom, setUsingCustom] = useState(false);
  const fileRef = useRef();

  const handleUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const json = JSON.parse(ev.target.result);
        if (json.metadata && json.alerts) {
          setData(json);
          setUsingCustom(true);
          setSelected(null);
        } else { alert("Invalid format. Expected {metadata, alerts}."); }
      } catch { alert("Invalid JSON file."); }
    };
    reader.readAsText(file);
  };

  const filtered = useMemo(() => {
    let items = data.alerts;
    if (filter !== "all") items = items.filter(a => a.prediction === filter);
    if (catFilter !== "all") items = items.filter(a => a.source_category === catFilter);
    if (search) items = items.filter(a => a.alert_text.toLowerCase().includes(search.toLowerCase()));
    return [...items].sort((a, b) => {
      const av = a[sortBy], bv = b[sortBy];
      if (typeof av === "number") return sortDir === "desc" ? bv - av : av - bv;
      return sortDir === "desc" ? String(bv).localeCompare(String(av)) : String(av).localeCompare(String(bv));
    });
  }, [data, filter, catFilter, search, sortBy, sortDir]);

  const stats = useMemo(() => {
    const t = data.alerts.filter(a => a.prediction === "threat").length;
    const correct = data.alerts.filter(a => a.prediction === a.actual_label).length;
    return { threats: t, benign: data.alerts.length - t, accuracy: (correct / data.alerts.length * 100).toFixed(1) };
  }, [data]);

  const requestLlm = useCallback(async (al) => {
    if (llmAnalysis[al.id] || llmLoading[al.id]) return;
    setLlmLoading(p => ({ ...p, [al.id]: true }));
    try {
      const r = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 1000, messages: [{ role: "user",
          content: `You are a senior SOC analyst. Analyze this security alert classified as "${al.prediction}" with ${(al.confidence*100).toFixed(1)}% confidence.\n\nAlert: ${al.alert_text}\n\nRule-based note: ${al.rule_summary.analyst_note}\n\nProvide a concise analyst report (3-4 sentences): what happened, why it matters or doesn't, and next steps. Be direct and actionable.` }] })
      });
      const d = await r.json();
      setLlmAnalysis(p => ({ ...p, [al.id]: d.content?.map(c => c.text||"").join("")||"Analysis unavailable." }));
    } catch { setLlmAnalysis(p => ({ ...p, [al.id]: "Error connecting to analysis service." })); }
    setLlmLoading(p => ({ ...p, [al.id]: false }));
  }, [llmAnalysis, llmLoading]);

  const toggleSort = (col) => {
    if (sortBy === col) setSortDir(d => d === "desc" ? "asc" : "desc");
    else { setSortBy(col); setSortDir("desc"); }
  };

  return (
    <div className="container">
      <div className="header">
        <div style={{ display: "flex", alignItems: "baseline", gap: 12 }}>
          <h1>Alert classification</h1>
          <span className="model-tag">{data.metadata.model}</span>
        </div>
        <p className="subtitle">{usingCustom ? "Custom data loaded" : "Sample data"} — {data.alerts.length.toLocaleString()} alerts classified</p>
      </div>

      <div className="upload-section">
        <p>Load your classified_alerts.json from the inference script, or use the sample data below</p>
        <input type="file" accept=".json" ref={fileRef} onChange={handleUpload} style={{ display: "none" }} />
        <button className="upload-btn" onClick={() => fileRef.current.click()}>Upload classified_alerts.json</button>
      </div>

      <div className="stats-grid">
        <div className="stat-card threat"><div className="label">Threats detected</div><div className="value">{stats.threats.toLocaleString()}</div><div className="sub">of {data.alerts.length.toLocaleString()} total</div></div>
        <div className="stat-card benign"><div className="label">Benign filtered</div><div className="value">{stats.benign.toLocaleString()}</div><div className="sub">{(stats.benign/data.alerts.length*100).toFixed(0)}% noise removed</div></div>
        <div className="stat-card accuracy"><div className="label">Model accuracy</div><div className="value">{stats.accuracy}%</div><div className="sub">on test set</div></div>
        <div className="stat-card speed"><div className="label">Avg inference</div><div className="value">{data.metadata.avg_time_per_alert_ms}ms</div><div className="sub">per alert</div></div>
      </div>

      <div className="filters">
        {["all","threat","benign"].map(f => <button key={f} className={`filter-btn ${filter===f?"active":""}`} onClick={()=>setFilter(f)}>{f==="all"?"All":f==="threat"?"Threats":"Benign"}</button>)}
        <div className="divider"/>
        {["all","windows","linux","network","cloud"].map(c => <button key={c} className={`filter-btn ${catFilter===c?(c==="all"?"active":"active-cat"):""}`} style={{"--cat-color":catColors[c]}} onClick={()=>setCatFilter(c)}>{c==="all"?"All categories":c.charAt(0).toUpperCase()+c.slice(1)}</button>)}
        <input className="search-input" placeholder="Search alerts..." value={search} onChange={e=>setSearch(e.target.value)}/>
      </div>

      <div className="result-count">{filtered.length} alerts shown</div>

      <div className="main-layout">
        <div className={`table-section ${selected?"with-detail":""}`}>
          <div className="alert-table">
            <div className="table-header">
              {[["ID","id"],["Category","source_category"],["Alert","alert_text"],["Confidence","confidence"],["Verdict","prediction"]].map(([l,c])=>
                <span key={c} onClick={()=>toggleSort(c)}>{l} {sortBy===c?(sortDir==="desc"?"\u2193":"\u2191"):""}</span>
              )}
            </div>
            <div className="table-body">
              {filtered.map(a => (
                <div key={a.id} className={`alert-row ${selected?.id===a.id?"selected":""} ${a.prediction==="threat"?"is-threat":""}`} onClick={()=>setSelected(a)}>
                  <span className="id">#{a.id}</span>
                  <span className="cat-badge" style={{background:catColors[a.source_category]+"18",color:catColors[a.source_category]}}>{a.source_category}</span>
                  <span className="alert-text">{a.alert_text.replace(/\[(windows|linux|network|cloud)\]\s*/,"")}</span>
                  <div className="conf-cell">
                    <div className="conf-value" style={{color:a.prediction==="threat"?"#fca5a5":"#86efac"}}>{(a.confidence*100).toFixed(1)}%</div>
                    <div className="conf-bar"><div className="conf-bar-fill" style={{width:`${a.confidence*100}%`,background:a.prediction==="threat"?"#ef4444":"#10b981"}}/></div>
                  </div>
                  <span className="verdict-badge" style={{background:a.prediction==="threat"?"#ef44441a":"#10b9811a",color:a.prediction==="threat"?"#fca5a5":"#86efac"}}>{a.prediction==="threat"?"THREAT":"BENIGN"}</span>
                </div>
              ))}
            </div>
          </div>
        </div>

        {selected && (
          <div className="detail-section">
            <div className="detail-panel">
              <div className="detail-top">
                <div style={{display:"flex",gap:8}}>
                  <span className="verdict-badge" style={{background:selected.prediction==="threat"?"#ef44441a":"#10b9811a",color:selected.prediction==="threat"?"#fca5a5":"#86efac",fontSize:12,fontWeight:700}}>{selected.prediction.toUpperCase()}</span>
                  <span className="cat-badge" style={{background:catColors[selected.source_category]+"18",color:catColors[selected.source_category]}}>{selected.source_category}</span>
                </div>
                <button className="close-btn" onClick={()=>setSelected(null)}>&times;</button>
              </div>

              <div className="detail-label">Alert #{selected.id}</div>
              <div className="detail-alert-text">{selected.alert_text}</div>

              <div className="detail-metrics">
                <div className="detail-metric"><div className="dm-label">Confidence</div><div className="dm-value" style={{color:selected.prediction==="threat"?"#fca5a5":"#86efac"}}>{(selected.confidence*100).toFixed(2)}%</div></div>
                <div className="detail-metric"><div className="dm-label">Actual label</div><div className="dm-value" style={{fontSize:14,fontWeight:600,color:selected.actual_label===selected.prediction?"#86efac":"#fca5a5"}}>{selected.actual_label} {selected.actual_label===selected.prediction?"\u2713":"\u2717 mismatch"}</div></div>
              </div>

              <div className="detail-label">Key fields</div>
              <div style={{marginBottom:16}}>
                {Object.entries(selected.rule_summary.key_fields).map(([k,v])=>
                  <div key={k} className="key-field"><span className="kf-label">{k}:</span><span className="kf-value">{v}</span></div>
                )}
              </div>

              <div className="detail-label">Rule-based assessment</div>
              <div className={`assessment-box ${selected.prediction}`}>{selected.rule_summary.analyst_note}</div>

              <div className="detail-label">AI detailed analysis</div>
              {llmAnalysis[selected.id] ? (
                <div className="assessment-box ai">{llmAnalysis[selected.id]}</div>
              ) : (
                <button className="ai-btn" onClick={()=>requestLlm(selected)} disabled={llmLoading[selected.id]}>
                  {llmLoading[selected.id]?"Analyzing...":"Request AI analysis"}
                </button>
              )}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("app"));
</script>
</body>
</html>
